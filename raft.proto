syntax = "proto3";

// gRPC interface for the Raft cluster: two peer-to-peer RPCs used by the
// consensus protocol, and one client-facing RPC for the key-value store.

// A single replicated log entry. `command` is "SET <key> <value>" or "NO-OP".
message Entry {
    int32 term = 1;
    string command = 2;
}

// -- RequestVote: a candidate campaigns for a term ------------------------

message RequestVoteRequest {
    int32 term = 1;
    int32 candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

message RequestVoteResponse {
    int32 term = 1;
    bool voteGranted = 2;
    // Time left on the lease this voter has granted to the old leader. A new
    // leader must wait it out before serving reads.
    double leaseDuration = 3;
}

// -- ProcessLog: AppendEntries, heartbeat and lease renewal ---------------

message LogRequest {
    int32 leaderId = 1;
    int32 term = 2;
    // The follower accepts `suffix` only if its own log matches the leader's
    // at this position, which is how divergent logs are detected.
    int32 prefixLen = 3;
    int32 prefixTerm = 4;
    int32 leaderCommit = 5;
    repeated Entry suffix = 6;
    // Seconds for which the follower promises not to elect anyone else.
    int32 leaseInterval = 7;
}

message LogResponse {
    int32 follower = 1;
    int32 term = 2;
    int32 ack = 3;  // number of entries the follower now holds
    bool success = 4;
}

// -- ServeClient: the key-value API --------------------------------------

message ServeClientArgs {
    string Request = 1;  // "SET <key> <value>" or "GET <key>"
}

message ServeClientReply {
    string Data = 1;
    int32 LeaderID = 2;  // set on failure so the client can redirect
    bool Success = 3;
}

service Raft {
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse) {}
    rpc ProcessLog(LogRequest) returns (LogResponse) {}
    rpc ServeClient(ServeClientArgs) returns (ServeClientReply) {}
}
